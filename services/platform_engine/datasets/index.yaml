version: 1
name: AI-CAR-SCANER Global Diagnostic Dataset Registry

description: >
  Central registry for diagnostic datasets shared by the diagnostic engine,
  evaluation pipeline, simulators, and application tooling.

datasets:
  golden_cases:
    path: datasets/golden-cases
    purpose: Golden diagnostic cases used for deterministic reasoning and safety regression.
    files:
      - datasets/golden-cases/LPG_MISFIRE_001.yaml

  rag_eval:
    path: datasets/rag-eval
    purpose: Retrieval and RAG regression/evaluation cases.
    files:
      - datasets/rag-eval/phase12_golden_cases.jsonl

  vehicle_scenarios:
    path: datasets/vehicle-scenarios
    purpose: Vehicle and protocol simulator scenarios.
    files:
      - datasets/vehicle-scenarios/uds-basic.yaml

source_of_truth: finalbuild/datasets
