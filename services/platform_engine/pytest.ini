[pytest]
testpaths = tests
pythonpath = . backend
# pytest-benchmark is not used by this repository's test suite and on the
# current Windows/Python 3.14/PySide6 setup it crashes during Qt test collection.
# The project has its own deterministic perf_counter-based performance test.
addopts = -p no:benchmark

# Make async loop lifetimes explicit for Python 3.14+ and pytest-asyncio 1.x.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
